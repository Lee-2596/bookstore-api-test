login_cases:
  - case_name: 正常登录管理员
    username: admin
    password: admin123
    expected_code: 200

  - case_name: 正常登录普通用户
    username: testuser
    password: test123
    expected_code: 200

  - case_name: 密码错误
    username: admin
    password: wrongpass
    expected_code: 4006

  - case_name: 用户不存在
    username: notexist_user
    password: anything
    expected_code: 4006

  - case_name: 用户名为空
    username: ""
    password: "123456"
    expected_code: 4001

  - case_name: 密码为空
    username: admin
    password: ""
    expected_code: 4001

  - case_name: 用户名长度不足
    username: ab
    password: "123456"
    expected_code: 4006   # 登录不区分具体错误，统一返回 4006（安全设计）

  - case_name: 密码长度不足
    username: admin
    password: "12345"
    expected_code: 4006   # 同上